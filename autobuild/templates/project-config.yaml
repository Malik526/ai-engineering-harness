# Starter .autobuild/config.yaml for a project adopting autobuild.
# Copy to <project>/.autobuild/config.yaml, adjust, then run:
#   ~/.agents/autobuild/bin/autobuild config <project>
# Schema: ~/.agents/autobuild/schemas/config.schema.json
version: 1

project:
  name: Example Project

agents:                      # any registry provider may fill any role it supports
  planner:
    provider: codex
  implementer:
    provider: claude
  reviewer:
    provider: codex          # same provider as implementer is allowed: independence = fresh session

# providers:                 # optional overrides, keyed by provider id
#   claude:
#     command: claude
#     model: <model id>

# rollover:                  # optional; absent = a quota/session failure stops for a human (with a handoff)
#   max_rollovers: 1         # per run; at most 1
#   approval: automatic      # automatic | human (prepare the handoff, wait for `autobuild resume`)
#   implementer: [codex]     # ordered replacement implementers; a new session takes over the worktree
#   # on: [quota_exhausted, session_unavailable]   # default: every eligible failure kind

git:
  protected_branches: [main]
  branch_prefix: agent/
  checkpoint_commits: false  # true: eligible controller commit after validation and independent PASS
  # default_base_branch: main
  # worktree_root: ../example.worktrees   # default: <project>.worktrees beside the project

paths:                       # repository-relative
  roadmap: docs/roadmap      # README index + <milestone>/<implementation-brief>.md
  project_state: PROJECT_STATE.md
  adr_directory: docs/decisions
  runs_directory: .autobuild/runs

limits:                      # governance: checked by the controller before every agent/tool operation
  max_review_cycles: 3
  max_consecutive_implementations: 5
  implementer_timeout_seconds: 3600
  reviewer_timeout_seconds: 3600
  # max_runtime_minutes: 120       # active controller time; a running provider is stopped at the limit
  # max_revision_attempts: 4       # implementer invocations after the first (revisions, resumes, rollover)
  # max_validation_attempts: 6
  # max_browser_attempts: 6
  # max_usage_tokens: 5000000      # provider-reported tokens; needs providers that report usage

validation:
  browser_tool: none         # none | playwright | agent-browser
  require_clean_git_before_start: true
  commands:                  # controller-owned validation; ${PROJECT_ROOT} / ${WORKTREE} substituted
    - name: tests
      kind: test             # setup | test | lint | typecheck | build | other
      command: [python, -m, pytest, -q]
      # cwd: web             # repository-relative
      # env: {PYTHONPATH: "${WORKTREE}/src"}
      # paths: ["web/*"]     # run only when matching files changed
      # required: true
      # timeout_seconds: 1800

notifications:
  enabled: false
  provider: console          # console | file (run/notifications/) | email
  # email:                   # required for provider: email; credentials only via environment variables
  #   to: [you@example.com]
  #   from: autobuild@example.com
  #   smtp_host: smtp.example.com
  #   security: starttls     # starttls | ssl | none
  #   username_env: AUTOBUILD_SMTP_USER
  #   password_env: AUTOBUILD_SMTP_PASSWORD

control:
  remote_stop_enabled: false
  provider: none             # none | file (autobuild stop RUN); github/supabase are not implemented
