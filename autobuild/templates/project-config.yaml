# Starter .autobuild/config.yaml for a project adopting autobuild.
# Copy to <project>/.autobuild/config.yaml, adjust, then run:
#   ~/.agents/autobuild/bin/autobuild config <project>
# Schema: ~/.agents/autobuild/schemas/config.schema.json
version: 1

project:
  name: Example Project

agents:                      # any registry provider may fill any role it supports
  planner:
    provider: codex
  implementer:
    provider: claude
  reviewer:
    provider: codex          # same provider as implementer is allowed: independence = fresh session

# providers:                 # optional overrides, keyed by provider id
#   claude:
#     command: claude
#     model: <model id>

git:
  protected_branches: [main]
  branch_prefix: agent/

paths:                       # repository-relative
  roadmap: docs/roadmap
  project_state: PROJECT_STATE.md
  adr_directory: docs/decisions
  runs_directory: .autobuild/runs

limits:
  max_review_cycles: 3
  max_consecutive_implementations: 5

validation:
  browser_tool: none         # none | playwright | agent-browser
  require_clean_git_before_start: true

notifications:
  enabled: false
  provider: console          # console | file | email

control:
  remote_stop_enabled: false
  provider: none             # none | file | github | supabase
